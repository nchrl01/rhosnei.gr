name: Refresh shared live captures
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum exact coin/network identities to capture'
        required: true
        default: '100'
        type: string
      top1000:
        description: 'Process every supported top-1000 coin, retrying alternate listed networks'
        required: false
        default: false
        type: boolean
      ids:
        description: 'Optional comma-separated CoinGecko IDs or chain:address identities'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ inputs.ids && 'shared-live-captures-selected' || 'shared-live-captures' }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ${{ fromJSON(inputs.top1000 && '[1,2,3,4]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture regression checks
        run: node --test scripts/live-capture-regression.test.mjs scripts/capture-network.test.mjs
      - name: Check cloud publisher before rendering
        run: node scripts/capture-marketplace-live.mjs --check-publisher
      - name: Install isolated capture browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/upic-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/upic-capture-tools" --no-package-lock --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/upic-capture-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render actual market inputs and publish original frames
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/upic-browsers
          UPIC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/upic-capture-tools/node_modules/playwright/index.mjs
          UPIC_CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/upic-capture-report
          CAPTURE_LIMIT: ${{ inputs.limit || '40' }}
          CAPTURE_IDS: ${{ inputs.ids || '' }}
          CAPTURE_TOP1000: ${{ inputs.top1000 || 'false' }}
          CAPTURE_PART: ${{ matrix.part }}
        run: |
          args=(--publish --contracts-only --limit "$CAPTURE_LIMIT" --timeout 90 --concurrency 2)
          if [[ "$CAPTURE_TOP1000" == "true" ]]; then args+=(--top1000 --part "$CAPTURE_PART"); fi
          if [[ -n "$CAPTURE_IDS" ]]; then args+=(--ids "$CAPTURE_IDS"); fi
          node scripts/capture-marketplace-live.mjs "${args[@]}"
      - name: Preserve capture coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-capture-report-${{ matrix.part }}
          path: ${{ runner.temp }}/upic-capture-report/report.json
          if-no-files-found: ignore
          retention-days: 3
